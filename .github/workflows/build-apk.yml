name: Build Android TV and Fire TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle biblical illustrations for offline screensaver
        run: python3 scripts/download_artwork.py
      - name: Create original full-screen verse backgrounds
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/create_original_scenes.py
      - name: Bundle public-domain Arabic and English Bible
        run: python3 scripts/build_verse_library.py
      - name: Bundle exact Velthon branding and original soft ambient soundtrack
        run: python3 scripts/prepare_media.py
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Bible-TV-Android-FireTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
